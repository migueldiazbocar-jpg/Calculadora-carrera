name: Compilar y probar

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest
      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: calculadora-carrera-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK como descarga directa
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk calculadora-carrera.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima calculadora-carrera.apk \
            --target "${{ github.sha }}" \
            --title "Calculadora de carrera (última versión)" \
            --notes "Descarga calculadora-carrera.apk desde el móvil y ábrela para instalarla."
